name: Daily Career Radar

on:
  schedule:
    - cron: "30 1 * * *" # KST 10:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run daily career radar
        env:
          ARTICLE_SLACK_WEBHOOK_URL: ${{ secrets.ARTICLE_SLACK_WEBHOOK_URL }}
          JOB_SLACK_WEBHOOK_URL: ${{ secrets.JOB_SLACK_WEBHOOK_URL }}
        run: npm run start

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen-items.json
          git diff --cached --quiet || git commit -m "chore: update seen items"
          git push
